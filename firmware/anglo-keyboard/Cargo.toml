[package]
name = "anglo-keyboard"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true }
panic-reset = "0.1.1"

assign-resources = "0.5.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-boot = { version = "0.7.0", features = ["flash-erase-zero"] }
embassy-boot-stm32 = { version = "0.8.0" }
embassy-embedded-hal = { version = "0.6.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { version = "0.1.2" }
embassy-stm32 = { version = "0.6.0", features = ["stm32l072cb", "time-driver-any"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
portable-atomic = { version = "1.11.1", features = ["unsafe-assume-single-core"] }

i2c-proto = { path = "../lib/i2c-proto" }
util = { path = "../lib/util" }
version = { path = "../lib/version" }

[build-dependencies]
version = { path = "../lib/version" }

[features]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "panic-probe/print-defmt",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "version/defmt",
]

[profile.release]
debug = 2
opt-level = "z"
lto = true
codegen-units = 1
