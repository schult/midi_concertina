[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-boot-stm32 = "0.6.0"
embassy-stm32 = { version = "0.4.0", features = ["stm32l072cb"] }
embassy-sync = "0.7.2"
panic-reset = "0.1.1"

[profile.release]
lto = true
